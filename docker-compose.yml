services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contentgen}
      POSTGRES_USER: ${POSTGRES_USER:-contentgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentgen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contentgen} -d ${POSTGRES_DB:-contentgen}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DJANGO_WSGI_MODULE: ${DJANGO_WSGI_MODULE:-config.wsgi:application}
      DJANGO_ASGI_MODULE: ${DJANGO_ASGI_MODULE:-config.asgi:application}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}
      PORT: ${PORT:-8000}
      POSTGRES_DB: ${POSTGRES_DB:-contentgen}
      POSTGRES_USER: ${POSTGRES_USER:-contentgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentgen}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${DATABASE_URL:-postgresql://contentgen:contentgen@db:5432/contentgen}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_APP: ${CELERY_APP:-config.celery:app}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_LOGLEVEL: ${CELERY_LOGLEVEL:-info}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-5}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      STATIC_ROOT: ${STATIC_ROOT:-/app/staticfiles}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      RUN_DB_MIGRATIONS: ${RUN_DB_MIGRATIONS:-1}
      COLLECT_STATIC: ${COLLECT_STATIC:-1}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-1}
      WAIT_FOR_REDIS: ${WAIT_FOR_REDIS:-1}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
      REDIS_WAIT_TIMEOUT: ${REDIS_WAIT_TIMEOUT:-60}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_CMD_ARGS: ${GUNICORN_CMD_ARGS:---reload --access-logfile - --error-logfile -}
    command: ["/app/scripts/start-web.sh"]
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000${HEALTHCHECK_PATH:-/health/} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-contentgen}
      POSTGRES_USER: ${POSTGRES_USER:-contentgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentgen}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${DATABASE_URL:-postgresql://contentgen:contentgen@db:5432/contentgen}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_APP: ${CELERY_APP:-config.celery:app}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_LOGLEVEL: ${CELERY_LOGLEVEL:-info}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-5}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      STATIC_ROOT: ${STATIC_ROOT:-/app/staticfiles}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-1}
      WAIT_FOR_REDIS: ${WAIT_FOR_REDIS:-1}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
      REDIS_WAIT_TIMEOUT: ${REDIS_WAIT_TIMEOUT:-60}
      RUN_DB_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
    command: ["/app/scripts/start-worker.sh"]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
    environment:
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.local}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DEBUG: ${DEBUG:-1}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0}
      POSTGRES_DB: ${POSTGRES_DB:-contentgen}
      POSTGRES_USER: ${POSTGRES_USER:-contentgen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contentgen}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_URL: ${DATABASE_URL:-postgresql://contentgen:contentgen@db:5432/contentgen}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_APP: ${CELERY_APP:-config.celery:app}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/2}
      CELERY_LOGLEVEL: ${CELERY_LOGLEVEL:-info}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-5}
      MEDIA_ROOT: ${MEDIA_ROOT:-/app/media}
      STATIC_ROOT: ${STATIC_ROOT:-/app/staticfiles}
      WAIT_FOR_DB: ${WAIT_FOR_DB:-1}
      WAIT_FOR_REDIS: ${WAIT_FOR_REDIS:-1}
      DB_WAIT_TIMEOUT: ${DB_WAIT_TIMEOUT:-60}
      REDIS_WAIT_TIMEOUT: ${REDIS_WAIT_TIMEOUT:-60}
      RUN_DB_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
    command: ["/app/scripts/start-beat.sh"]
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
